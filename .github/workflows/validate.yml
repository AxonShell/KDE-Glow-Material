name: Validate

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check repository structure
        run: sh scripts/check-structure.sh
      - name: Validate Aurorae package
        run: python3 scripts/check-aurorae.py
